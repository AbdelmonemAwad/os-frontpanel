# The service, and the three questions the settings page asks that a service has no answer for.
#
# start, restart and reload carry the "one" prefix, and stop carries it too. That prefix tells
# rc.subr to do as it is asked without first consulting the switch in
# /usr/local/etc/rc.conf.d/frontpanel, and it is right here for two separate reasons.
#
# Coming from the page, the decision has already been made somewhere better: the framework's
# service controller reads general.enabled out of config.xml and only ever asks for a start when
# the panel is turned on. Asking rc.subr to make the same decision again, from a file that is a
# copy of that one, is how the two come to disagree.
#
# Going the other way it matters more. The page can turn the panel off and then ask for a stop,
# and a plain stop would by then be looking at a service it has been told is disabled - rc.subr
# declines those. The panel would be left lit in the rack showing whatever frame was on it at
# that moment, with the button that would have cleared it now refusing to work. A stop has to
# stop.
#
# The switch itself is what /etc/rc consults at boot, and nothing else. [enable] and [disable]
# below are how it is written.

[start]
command:/usr/local/etc/rc.d/frontpanel onestart
parameters:
type:script
message:starting the front panel

[stop]
command:/usr/local/etc/rc.d/frontpanel onestop
parameters:
type:script
message:stopping the front panel

[restart]
command:/usr/local/etc/rc.d/frontpanel onerestart
parameters:
type:script
message:restarting the front panel

# A restart under another name. LCDd reads its configuration once, when it starts, and the driver
# applies the port, the speed and the size of the panel at the moment it is loaded, so there is
# nothing a reload could do in place. It is here because the framework's own service controller
# reaches for it when a caller asks it not to force a restart, and answering that with a working
# panel is better than answering it with an error.
[reload]
command:/usr/local/etc/rc.d/frontpanel onereload
parameters:
type:script
message:reloading the front panel

# errors:no because the rc script exits 1 when the service is not running, as every rc script
# does, and configd throws a script's output away when it exits non-zero and answers "Execute
# error" instead. The output is the entire point of asking: the GUI reads this one line to decide
# between running, stopped and disabled.
[status]
command:/usr/local/etc/rc.d/frontpanel status
parameters:
errors:no
type:script_output
message:reading the front panel service status

# The switch /etc/rc reads at boot, in /usr/local/etc/rc.conf.d/frontpanel. These two are
# rc.subr's own enable and disable, which edit that file in place, so the plugin needs no
# template of its own and there is exactly one file where "this machine runs the panel" is
# written down.
[enable]
command:/usr/local/etc/rc.d/frontpanel enable
parameters:
type:script
message:starting the front panel at boot

[disable]
command:/usr/local/etc/rc.d/frontpanel disable
parameters:
type:script
message:no longer starting the front panel at boot

# What each enabled screen would put on the panel this second, at the configured size. Nothing is
# sent to the display, so this can be asked for with the service stopped - which is the point:
# somebody setting the plugin up should be able to see what they are about to show before they
# show it.
#
# errors:no for the same reason as [status]. A refusal - no driver chosen, a port that is not
# there, a screen that cannot read what it reports on - is exactly what the asker needs, and it
# arrives with a non-zero exit.
[preview]
command:/usr/local/opnsense/scripts/frontpanel/frontpanel.py screens
parameters:
errors:no
type:script_output
message:rendering the front panel screens

# The state of things around the panel, in two reports that are written separately and stay
# separate in the answer: what the keys have done, and what this machine looks like from the
# outside - its SMBIOS names, the serial ports it has and which of them carry a login prompt, the
# drivers LCDproc installed here, and the entry the appliance table proposes.
#
# The keys are polled rather than volunteered, and on hardware nobody has confirmed the honest
# answer is often "nothing has arrived". That is a fact worth showing plainly rather than an
# empty box, so this reports what each source saw and leaves the verdict to the page.
[diagnostics]
command:/usr/local/opnsense/scripts/frontpanel/frontpanel.py diagnostics
parameters:
errors:no
type:script_output
message:reading the front panel diagnostics

# Put one line on the panel and give the panel back. The line goes to LCDd like every other
# screen; nothing here touches the serial port.
#
# The parameter is the line itself. configd fills a %s the caller left out with an empty string
# and quotes whatever arrives, so a caller who named no text reaches the script with one empty
# argument - which the script reads as "use your own line" rather than as a mistake.
[test]
command:/usr/local/opnsense/scripts/frontpanel/frontpanel.py test
parameters:%s
errors:no
type:script_output
message:sending a test line to the front panel
